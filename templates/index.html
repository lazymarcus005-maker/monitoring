<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange:   #ff7528;
      --orange2:  #e85d04;
      --orange-dim: #7a3510;
      --bg:       #0b0c0b;
      --bg2:      #141614;
      --bg3:      #1c1f1c;
      --border:   #2e3a2e;
      --text:     #c8d8c0;
      --dim:      #5a7050;
      --green:    #4ec94e;
      --yellow:   #f0c040;
      --red:      #e04040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 10px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
      z-index: 999;
    }

    .card {
      width: 380px;
      border: 2px solid var(--orange2);
      background: var(--bg2);
      image-rendering: pixelated;
      box-shadow: 0 0 0 1px var(--bg), 0 0 0 3px var(--orange-dim),
                  0 0 24px rgba(232,93,4,.15);
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .9rem 1rem;
      border-bottom: 2px solid var(--orange2);
      background: var(--bg3);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    /* 8-bit pixel-art logo (CSS) */
    .pixel-logo {
      display: grid;
      grid-template-columns: repeat(8, 5px);
      grid-template-rows: repeat(8, 5px);
      gap: 1px;
      flex-shrink: 0;
    }

    .pixel-logo span {
      display: block;
      width: 5px;
      height: 5px;
    }

    .p1 { background: var(--orange); }
    .p2 { background: var(--orange2); }
    .p0 { background: transparent; }
    .pd { background: #3a1a08; }

    .logo-text { line-height: 1.9; }
    .logo-text .t1 { color: var(--orange); font-size: 10px; }
    .logo-text .t2 { color: var(--dim);    font-size: 7px; }

    .cost-wrap { text-align: right; line-height: 2; }
    .cost-wrap .amount { color: var(--orange); font-size: 13px; }
    .cost-wrap .total  { color: var(--dim);    font-size: 7px; }

    /* ── Metric boxes ────────────────────────────────── */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 2px solid var(--border);
    }

    .metric {
      padding: .7rem .6rem;
      border-right: 1px solid var(--border);
      text-align: center;
    }

    .metric:last-child { border-right: none; }

    .metric .mlabel {
      color: var(--dim);
      font-size: 6px;
      letter-spacing: .05em;
      margin-bottom: .5rem;
    }

    .metric .mvalue {
      color: var(--orange);
      font-size: 14px;
    }

    .metric .mvalue.ok   { color: var(--green); }
    .metric .mvalue.warn { color: var(--yellow); }
    .metric .mvalue.crit { color: var(--red); }

    /* ── Usage bars ──────────────────────────────────── */
    .bars-section {
      padding: .85rem 1rem;
      border-bottom: 2px solid var(--border);
    }

    .bars-title {
      color: var(--orange);
      font-size: 7px;
      margin-bottom: .75rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .6rem;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      position: relative;
      image-rendering: pixelated;
    }

    .bar-fill {
      height: 100%;
      background: var(--orange2);
      position: relative;
      transition: width .6s steps(10);
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0;
      width: 2px; height: 100%;
      background: var(--orange);
    }

    .bar-fill.warn { background: #7a6000; }
    .bar-fill.warn::after { background: var(--yellow); }
    .bar-fill.crit { background: #6a1010; }
    .bar-fill.crit::after { background: var(--red); }

    .bar-label {
      color: var(--dim);
      font-size: 6px;
      width: 68px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      padding: .55rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg3);
    }

    .footer .ping {
      color: var(--dim);
      font-size: 6px;
    }

    .footer .ping .dot {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--green);
      margin-right: 4px;
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .footer .updated {
      color: var(--dim);
      font-size: 6px;
    }

    /* ── claude.ai section ───────────────────────────── */
    .claude-section {
      padding: .85rem 1rem;
      border-bottom: 2px solid var(--border);
    }

    .claude-section .bars-title {
      margin-bottom: .75rem;
    }

    .setup-hint {
      font-size: 6px;
      color: var(--dim);
      line-height: 2;
    }

    .setup-hint a {
      color: var(--orange);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <!-- 8-bit pixel art of Claude/terminal icon -->
      <div class="pixel-logo" aria-hidden="true">
        <!-- row 1 --> <span class="p0"></span><span class="p0"></span><span class="p2"></span><span class="p2"></span><span class="p2"></span><span class="p2"></span><span class="p0"></span><span class="p0"></span>
        <!-- row 2 --> <span class="p0"></span><span class="p2"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p2"></span><span class="p0"></span>
        <!-- row 3 --> <span class="p2"></span><span class="p1"></span><span class="pd"></span><span class="p1"></span><span class="p1"></span><span class="pd"></span><span class="p1"></span><span class="p2"></span>
        <!-- row 4 --> <span class="p2"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p2"></span>
        <!-- row 5 --> <span class="p2"></span><span class="p1"></span><span class="p2"></span><span class="p1"></span><span class="p1"></span><span class="p2"></span><span class="p1"></span><span class="p2"></span>
        <!-- row 6 --> <span class="p2"></span><span class="p1"></span><span class="p1"></span><span class="pd"></span><span class="pd"></span><span class="p1"></span><span class="p1"></span><span class="p2"></span>
        <!-- row 7 --> <span class="p0"></span><span class="p2"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p1"></span><span class="p2"></span><span class="p0"></span>
        <!-- row 8 --> <span class="p0"></span><span class="p0"></span><span class="p2"></span><span class="p2"></span><span class="p2"></span><span class="p2"></span><span class="p0"></span><span class="p0"></span>
      </div>
      <div class="logo-text">
        <div class="t1">ANTHROPIC</div>
        <div class="t2">CLAUDE CODE</div>
      </div>
    </div>
    <div class="cost-wrap">
      <div class="amount" id="h-cost">$0.000000</div>
      <div class="total" id="h-reqs">0 REQUESTS</div>
    </div>
  </div>

  <!-- Metric boxes -->
  <div class="metrics">
    <div class="metric">
      <div class="mlabel">REQUESTS</div>
      <div class="mvalue" id="m-req">—</div>
    </div>
    <div class="metric">
      <div class="mlabel">TOKENS</div>
      <div class="mvalue" id="m-tok">—</div>
    </div>
    <div class="metric">
      <div class="mlabel">MODEL</div>
      <div class="mvalue ok" style="font-size:8px" id="m-model">haiku</div>
    </div>
  </div>

  <!-- Usage bars -->
  <div class="bars-section">
    <div class="bars-title">&gt; usage.limit</div>

    <div class="bar-row">
      <div class="bar-track">
        <div class="bar-fill" id="bar-req" style="width:0%"></div>
      </div>
      <div class="bar-label" id="lbl-req">REQUESTS</div>
    </div>

    <div class="bar-row">
      <div class="bar-track">
        <div class="bar-fill" id="bar-tok" style="width:0%"></div>
      </div>
      <div class="bar-label" id="lbl-tok">TOKENS</div>
    </div>

    <div class="bar-row">
      <div class="bar-track">
        <div class="bar-fill" id="bar-in" style="width:0%"></div>
      </div>
      <div class="bar-label" id="lbl-in">IN TOKENS</div>
    </div>

    <div class="bar-row">
      <div class="bar-track">
        <div class="bar-fill" id="bar-out" style="width:0%"></div>
      </div>
      <div class="bar-label" id="lbl-out">OUT TOKENS</div>
    </div>
  </div>

  <!-- claude.ai session/weekly usage -->
  <div class="claude-section" id="claude-section">
    <div class="bars-title">&gt; claude.ai usage</div>
    <div id="claude-body">
      <div class="setup-hint">
        รัน setup_auth.py บน host แล้ว<br>
        copy claude_auth.json มาไว้ใน folder เดียวกัน
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="ping"><span class="dot"></span>AUTO PING 5M</div>
    <div class="updated" id="f-updated">WAITING...</div>
  </div>

</div>

<script>
  const $ = id => document.getElementById(id);

  function pct(limit, remaining) {
    if (!limit || !remaining) return 0;
    return Math.min(100, Math.round((parseInt(limit) - parseInt(remaining)) / parseInt(limit) * 100));
  }

  function barClass(p) {
    return p >= 90 ? 'crit' : p >= 70 ? 'warn' : '';
  }

  function fmtReset(iso) {
    if (!iso) return '';
    const m = Math.max(0, Math.round((new Date(iso) - Date.now()) / 60000));
    return m < 1 ? '<1m' : m + 'm';
  }

  function setBar(barId, lblId, label, limit, remaining, reset) {
    const p = pct(limit, remaining);
    const bar = $(barId);
    bar.style.width = p + '%';
    bar.className = 'bar-fill ' + barClass(p);
    const resetStr = reset ? ' ' + fmtReset(reset) : '';
    $(lblId).textContent = label + ' ' + p + '%' + resetStr;
  }

  function setMetric(id, value, threshold70, threshold90) {
    const el = $(id);
    const n = parseInt(value);
    el.textContent = isNaN(n) ? value : value;
    el.className = 'mvalue' +
      (n >= threshold90 ? ' crit' : n >= threshold70 ? ' warn' : ' ok');
  }

  async function refresh() {
    const [rl, sm] = await Promise.all([
      fetch('/api/ratelimits').then(r => r.json()),
      fetch('/api/summary').then(r => r.json()),
    ]);

    // header
    $('h-cost').textContent = '$' + sm.total_cost_usd.toFixed(6);
    $('h-reqs').textContent = sm.total_requests + ' REQUESTS';

    // metric boxes
    const reqPct = pct(rl.requests_limit, rl.requests_remaining);
    const tokPct = pct(rl.tokens_limit,   rl.tokens_remaining);
    setMetric('m-req',   reqPct + '%', 70, 90);
    setMetric('m-tok',   tokPct + '%', 70, 90);

    // bars
    setBar('bar-req', 'lbl-req', 'REQ',  rl.requests_limit,     rl.requests_remaining,     rl.requests_reset);
    setBar('bar-tok', 'lbl-tok', 'TOK',  rl.tokens_limit,       rl.tokens_remaining,       rl.tokens_reset);
    setBar('bar-in',  'lbl-in',  'IN',   rl.input_tokens_limit, rl.input_tokens_remaining, null);
    setBar('bar-out', 'lbl-out', 'OUT',  rl.output_tokens_limit,rl.output_tokens_remaining,null);

    // claude.ai session/weekly
    const cu = rl.claude_usage || {};
    const cb = $('claude-body');
    if (!rl.auth_ready) {
      cb.innerHTML = `<div class="setup-hint">
        รัน <span style="color:var(--orange)">setup_auth.py</span> บน host แล้ว copy claude_auth.json มาไว้ใน project folder
      </div>`;
    } else if (cu.error) {
      cb.innerHTML = `<div class="setup-hint" style="color:var(--red)">ERR: ${cu.error.substring(0,60)}</div>`;
    } else if (cu.session_pct == null) {
      cb.innerHTML = `<div class="setup-hint">กำลังโหลด... (5 min)</div>`;
    } else {
      const rows = [
        ['SESSION', cu.session_pct,       cu.session_resets],
        ['WEEKLY',  cu.weekly_all_pct,    cu.weekly_resets],
        ['DESIGN',  cu.weekly_design_pct, null],
      ].filter(r => r[1] != null);

      cb.innerHTML = rows.map(([label, p, rst]) => {
        const cls = p >= 90 ? 'crit' : p >= 70 ? 'warn' : '';
        const rstStr = rst ? ' ' + rst.substring(0,16) : '';
        return `<div class="bar-row">
          <div class="bar-track"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
          <div class="bar-label">${label} ${p}%${rstStr}</div>
        </div>`;
      }).join('');
    }

    if (cu.routine_max) {
      const rp = Math.round((cu.routine_used / cu.routine_max) * 100);
      const rc = rp >= 90 ? 'crit' : rp >= 70 ? 'warn' : '';
      $('claude-body').innerHTML += `<div class="bar-row" style="margin-top:.4rem">
        <div class="bar-track"><div class="bar-fill ${rc}" style="width:${rp}%"></div></div>
        <div class="bar-label">ROUTINE ${cu.routine_used}/${cu.routine_max}</div>
      </div>`;
    }

    // footer
    const pingTxt = cu.scraped_at ? 'SCRAPED ' + cu.scraped_at : (rl.last_ping_at ? 'PING ' + rl.last_ping_at : 'WAITING...');
    $('f-updated').textContent = pingTxt;
  }

  refresh();
  setInterval(refresh, 15_000);
</script>
</body>
</html>
